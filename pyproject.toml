[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lexcivis"
version = "1.0.0"
description = "Governance sandbox for a bilingual public-services AI over Mauritania's official administrative procedures"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mohamed Vadel Hadweni" }]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sentence-transformers>=3.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lexcivis = "lexcivis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lexcivis.resources" = ["*.yaml"]
"lexcivis.governance.resources" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
